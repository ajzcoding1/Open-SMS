name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build QuickSMS Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Wrapper
        working-directory: android-kotlin
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android-kotlin
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: android-kotlin
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/QuickSMS-Pro-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickSMS-Pro-v1.0.0-APK
          path: android-kotlin/app/build/outputs/apk/debug/QuickSMS-Pro-v1.0.0.apk
          retention-days: 30
